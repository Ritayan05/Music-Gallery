{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Gallery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>

    <!-- Navbar -->
    <header class="d-flex justify-content-between align-items-center">
        <h1>🎵 Music Gallery</h1>
        <nav>
            <a href="{% url 'profile' %}" class="btn btn-custom">Profile</a>
            <a href="{% url 'playlists' %}" class="btn btn-custom">My Playlists</a>
            <a href="{% url 'suggested_songs' %}" class="btn btn-custom">Suggested Songs</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="footer" >
        <p>© 2025 Music Gallery. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
