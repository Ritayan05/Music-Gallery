{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-center">
    <form method="POST" class="w-50">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-custom w-100">Create Playlist</button>
    </form>
</div>
{% endblock %}
